<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f1923" />
      <stop offset="100%" stop-color="#06090d" />
    </radialGradient>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#059669" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" stroke="#10b981" stroke-width="6" stroke-opacity="0.25" />
  
  <!-- Radar concentric circles -->
  <circle cx="256" cy="256" r="210" fill="url(#radarGlow)" stroke="#10b981" stroke-width="2" stroke-opacity="0.15" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3" />
  <circle cx="256" cy="256" r="60" fill="none" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.4" />
  
  <!-- Crosshairs -->
  <line x1="256" y1="46" x2="256" y2="466" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.15" />
  <line x1="46" y1="256" x2="466" y2="256" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.15" />

  <!-- Dynamic audio waveform bars in center -->
  <rect x="160" y="226" width="16" height="60" rx="8" fill="url(#waveGrad)" />
  <rect x="192" y="196" width="16" height="120" rx="8" fill="url(#waveGrad)" />
  <rect x="224" y="156" width="16" height="200" rx="8" fill="url(#waveGrad)" />
  <rect x="256" y="130" width="16" height="252" rx="8" fill="#34d399" />
  <rect x="288" y="170" width="16" height="172" rx="8" fill="url(#waveGrad)" />
  <rect x="320" y="210" width="16" height="92" rx="8" fill="url(#waveGrad)" />
  <rect x="352" y="236" width="16" height="40" rx="8" fill="url(#waveGrad)" />

  <!-- Center Core Beacon -->
  <circle cx="256" cy="256" r="10" fill="#ffffff" />
  <circle cx="256" cy="256" r="18" fill="none" stroke="#34d399" stroke-width="3" />
</svg>
